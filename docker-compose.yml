services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000

  streamlit:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
    command: streamlit run src/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - api
